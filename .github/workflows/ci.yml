name: Lightweight checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: python -c "import forex_rl; import forex_rl_simulator"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest

# This workflow intentionally never installs research extras, downloads market
# data, starts RL training, or executes a full historical walk-forward run.
